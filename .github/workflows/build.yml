name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test escritorio (paridad core/)
        run: python src/selftest.py
        working-directory: apps/desktop
      - name: Self-test web (paridad core/)
        run: node apps/web/src/selftest.mjs

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x86          # 32-bit: corre en Windows 32 y 64 bits
      - name: Instalar PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Compilar
        run: python -m PyInstaller --noconfirm --clean --distpath dist --workpath build packaging\EquipateFull.spec
        working-directory: apps/desktop
      - name: Comprobar arquitectura (debe ser 32-bit)
        run: |
          python -c "import struct; d=open('dist/EquipateFull.exe','rb').read(0x400); e=struct.unpack_from('<I',d,0x3c)[0]; m=struct.unpack_from('<H',d,e+4)[0]; print(hex(m)); assert m==0x14c, 'no es 32-bit'"
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: EquipateFull-32bit
          path: apps/desktop/dist/EquipateFull.exe
      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/dist/EquipateFull.exe
